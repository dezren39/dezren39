# Thin caller for this repo's dispatch-scheduled agents, replacing the
# retired Jules scheduled tasks and Suggestions.
# This file is only a caller: the task list, slot table, and prompts live
# centrally in developing-today/code — in the reusable workflow
# .github/workflows/pm-scheduled.yml and the pm-dispatch-task prompt
# library.
# Times are America/Chicago converted from CDT: tasks run at 00:00 local
# (05:00 UTC, cron "0 5 * * *") and suggestions at 13:00 local (18:00 UTC,
# cron "0 18 * * *"). GitHub cron is UTC-only, so during CST the local
# fire time shifts one hour earlier.

name: Agents

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Task to dispatch"
        required: true
        type: choice
        default: all
        options:
          - all
          - bolt
          - palette
          - suggestions

permissions:
  id-token: write
  contents: read

jobs:
  scheduled:
    uses: developing-today/code/.github/workflows/pm-scheduled.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      schedule: ${{ github.event.schedule }}
      # Empty on schedule events (no inputs) and for the 'all' selector,
      # which lets the central workflow run its full slot for the cron;
      # a specific manual pick passes just that task name.
      tasks: ${{ inputs.task != 'all' && inputs.task || '' }}
