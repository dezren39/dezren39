name: readme-scribe

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */1 * *'
  push:
    branches:
      - 'main'
    paths:
      # The generator's output depends only on the template (plus this
      # workflow itself). Any other push — journal entries (.jules/),
      # palette files, renovate.json, or the generated README.md itself —
      # cannot change the output, so skip the run entirely instead of
      # spending ~20s of runner time plus GitHub API queries on a no-op.
      # (Note: `paths` and `paths-ignore` cannot be combined; README.md
      #  is excluded implicitly by not being listed here.)
      - 'templates/**'
      - '.github/workflows/readme.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      # Same allowlist for PR validation runs: only run the generator
      # when the PR could actually change its output.
      - 'templates/**'
      - '.github/workflows/readme.yml'

# Read-only by default; the job's commit step needs contents: write.
permissions:
  contents: read

# Generation is idempotent (it always rewrites README.md from the template),
# so a newer run can safely supersede an older one. Without this, an overlapping
# manual dispatch or template push queues a second identical run that repeats
# the same GitHub queries and races the first to commit the same file.
concurrency:
  group: readme-scribe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-scribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Generator runs finish in ~20s; cap the job so a hung runner or
    # stalled API call can't burn minutes instead of failing fast.
    timeout-minutes: 10
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      -
        uses: muesli/readme-scribe@d2f6ab32d6b9f5b59941fe782d6c7e6499a37fe4
        with:
          template: templates/README.md.tpl
          writeTo: README.md
        env:
          GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
      -
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        if: github.event_name != 'pull_request'
        with:
          branch: main
          commit_author: "dezren39-bot <bot@dezren39.dev>"
          commit_message: "Apply automatic changes"
          commit_user_name: "dezren39-bot"
          commit_user_email: "bot@dezren39.dev"
